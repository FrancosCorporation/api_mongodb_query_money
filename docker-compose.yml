services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - dados_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:20-alpine
    working_dir: /app
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017/query_money
      JWT_SECRET: ${JWT_SECRET:-troque-este-secret-em-producao}
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    command: sh -c "npm install --omit=dev && npm start"

volumes:
  dados_mongo:
